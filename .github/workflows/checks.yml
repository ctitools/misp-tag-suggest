name: checks

# Same four jobs as generic-ai-misp-module (.github/workflows/checks.yml there); keep in sync.

on:
  push:
  pull_request:

env:
  RUFF: "0.16.6"
  RUNTIME: "tagrec retrieval scripts app.py tests"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uvx ruff@${RUFF} check .
          uvx ruff@${RUFF} format --check .

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --group dev
      # experiments/ is research code and excluded via pyproject ignore-paths
      - run: uv run pylint --disable=fixme ${RUNTIME}

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --group dev
      # offline only: synthetic events, a local HTTP MISP double, fake faiss/encoder
      - run: uv run pytest -q

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx semgrep scan --config p/python --config p/security-audit --error ${RUNTIME}
