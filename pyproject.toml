[project]
name = "misp-tag-suggest"
version = "0.3.0"
description = "Reproducible semantic retrieval and tag suggestions for MISP"
requires-python = ">=3.14"
dependencies = [
  "datasketch>=2,<3",
  "fastapi>=0.116,<1",
  "faiss-cpu>=1.13,<2",
  "ijson>=3.4,<4",
  "jsonschema>=4.25,<5",
  "numpy>=2,<3",
  "pymisp>=2.5,<3",
  "python-dotenv>=1.2,<2",
  "requests>=2.32,<3",
  "sentence-transformers>=5.2,<6",
  "tldextract>=5.3,<6",
  "torch>=2.2,<3",
  "transformers>=4.57,<4.58",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff",
  "pylint",
]
training = [
  "accelerate>=1.12,<2",
  "datasets>=4.5,<5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Lint and test configuration: identical to generic-ai-misp-module (see AGENTS.md).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt text and recorded HTTP bodies: reflowing them would change what is sent/compared
"experiments/lfm25/sol_flex_runner.py" = ["E501"]
"tests/test_sol_flex_runner.py" = ["E501"]

[tool.pylint.main]
py-version = "3.14"
# experiments/ is research code: ruff only (AGENTS.md)
ignore-paths = ["experiments"]

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  # research code kept as written; complexity metrics would force refactors without a test gain
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-return-statements",
  "too-many-instance-attributes",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-few-public-methods",
  "duplicate-code",
  # test fakes mirror the real signatures they replace
  "unused-argument",
]

[tool.pylint.typecheck]
ignored-modules = ["faiss"]  # SWIG wrappers: pylint misreads the signatures
