[project]
name = "misp-suggest"
version = "0.2.0"
description = "Reproducible semantic retrieval and tag suggestions for MISP"
requires-python = ">=3.12"
dependencies = [
  "datasketch>=2,<3",
  "fastapi>=0.116,<1",
  "faiss-cpu>=1.13,<2",
  "ijson>=3.4,<4",
  "numpy>=2,<3",
  "pymisp>=2.5,<3",
  "python-dotenv>=1.2,<2",
  "requests>=2.32,<3",
  "sentence-transformers>=5.2,<6",
  "tldextract>=5.3,<6",
  "torch>=2.2,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
